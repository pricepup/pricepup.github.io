<title>PricePup 格價狗</title>
<style>
:root{--bg:#fff8ef;--card:#fff;--text:#3b2a20;--muted:#8b7262;--line:#f0dfcc;--accent:#e07a3f;--accent-dk:#b85a26;--accent-text:#fff;--soft:#ffe6c7;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.brand{font-family:"Baloo 2",system-ui,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:var(--head);border-bottom:2px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:8px}
header.top h1{font-size:21px;margin:0;flex:1;font-weight:800;color:var(--accent-dk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .dog{width:40px;height:40px;flex:0 0 40px}
header.top button{background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:12px;font-size:20px;width:38px;height:38px;flex:0 0 38px}
main{padding:12px 16px 100px;max-width:640px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs a{flex:1;text-align:center;padding:8px 0 9px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}
nav.tabs a span{display:block;font-size:22px;line-height:1.2;transition:transform .2s}
nav.tabs a.on{color:var(--accent-dk)}
nav.tabs a.on span{transform:translateY(-2px) scale(1.15)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:14px;font:inherit;font-size:17px;font-weight:700;background:var(--accent);color:var(--accent-text);margin:0 0 10px;cursor:pointer;box-shadow:0 4px 0 var(--accent-dk);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dk)}
.btn.sec{background:var(--card);color:var(--text);border:2px solid var(--line);box-shadow:var(--shadow);font-weight:600}
.btn.small{display:inline-flex;width:auto;padding:8px 12px;font-size:14px;margin:0 6px 6px 0;border-radius:14px}
.btn.danger{background:var(--bad-bg);color:var(--bad);box-shadow:0 3px 0 rgba(194,85,58,.25)}
.btn .dog{width:46px;height:46px;margin:-8px 0}
.hero{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.hero .dog{width:84px;height:84px;flex:0 0 84px}
.hero .bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;font-weight:600;box-shadow:var(--shadow)}
.hero .bubble:before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:var(--line);border-left:0}
.hero .bubble small{display:block;font-weight:400;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
input.big{font-size:30px;font-weight:800;padding:8px 12px;font-family:"Baloo 2",system-ui,sans-serif}
.muted{color:var(--muted);font-size:14px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--line);text-decoration:none;color:inherit}
.item:last-child{border-bottom:0}
.thumb{width:54px;height:54px;border-radius:16px;object-fit:cover;background:var(--soft);flex:0 0 54px;display:flex;align-items:center;justify-content:center;font-size:26px}
.item .main{flex:1;min-width:0}
.item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .price{text-align:right;font-weight:800;font-family:"Baloo 2",system-ui,sans-serif;font-size:18px;line-height:1.2}
.item .price .muted{font-family:system-ui,sans-serif;font-size:12px}
.verdict{border-radius:16px;padding:10px 12px;font-weight:700;margin:10px 0;display:flex;gap:10px;align-items:center}
.verdict .dog{width:52px;height:52px;flex:0 0 52px}
.verdict.good{background:var(--good-bg);color:var(--good)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict.eq{background:var(--eq-bg)}
.verdict.none{background:var(--eq-bg);color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:2px solid var(--accent);color:var(--accent-dk);background:var(--soft);border-radius:999px;padding:6px 14px;font:inherit;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--good-bg);color:var(--good);margin-left:4px;font-weight:700}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column}
.overlay video{flex:1;width:100%;object-fit:cover;min-height:0}
.overlay .bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#1c1410}
.overlay .bar input{background:#2a201a;color:#fff;border-color:#4a3a2f}
.overlay .frame{position:absolute;left:10%;right:10%;top:30%;height:22%;border:4px dashed #ffd9a8;border-radius:20px;pointer-events:none}
.overlay .msg{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px;font-weight:700;text-shadow:0 1px 3px #000}
.overlay .msg .dog{width:46px;height:46px}
#toast{position:fixed;left:16px;right:16px;bottom:88px;z-index:30;background:#3b2a20;color:#fff;padding:12px 14px;border-radius:16px;font-size:15px;font-weight:600;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;text-align:center}
#toast.show{opacity:.96;transform:none}
svg.chart{width:100%;height:140px;display:block}
.big-num{font-size:30px;font-weight:800;font-family:"Baloo 2",system-ui,sans-serif;line-height:1.1}
h2{font-size:17px;margin:0 0 8px}
.empty{text-align:center;padding:10px 0}
.empty .dog{width:110px;height:110px;display:block;margin:0 auto 6px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:700}
.seg button.on{border-color:var(--accent);background:var(--soft);color:var(--accent-dk)}
#syncBadge{font-size:13px;font-weight:700;text-decoration:none;padding:5px 9px;border-radius:999px;background:var(--card);border:2px solid var(--line);color:var(--muted);white-space:nowrap}
#syncBadge.ok{color:var(--good);border-color:var(--good-bg)}#syncBadge.warn{color:var(--bad)}
.dog .ear{transform-box:fill-box;transform-origin:50% 8%;animation:wag 1.4s ease-in-out infinite alternate}
.dog .ear.r{animation-delay:-.7s}
@keyframes wag{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.dog .ear,.bounce{animation:none}}
</style>
</head>

<header class="top"><button id="backBtn" class="hidden" aria-label="Back">‹</button><span id="headDog"></span><h1 id="title" class="brand">PricePup</h1><a id="syncBadge" class="hidden" href="#settings"></a></header>
<main id="app"></main>
<nav class="tabs">
  <a href="#home" data-tab="home"><span>🦴</span><b data-t="tabProducts"></b></a>

  <a href="#compare" data-tab="compare"><span>⚖️</span><b data-t="tabCompare"></b></a>

</nav>

<div id="scanner" class="overlay hidden">

  <div class="msg"><span id="scanDog"></span><span id="scanMsg"></span></div>
  <div class="bar">
    <div class="row" style="margin-bottom:8px">
      <button class="btn sec small" id="torchBtn" style="display:none">🔦 <span data-t="torch"></span></button>
      <button class="btn sec small" id="photoScanBtn">🖼️ <span data-t="fromPhoto"></span></button>
      <button class="btn sec small" id="closeScanBtn">✕ <span data-t="close"></span></button>
    </div>
    <div class="row">
      <input id="manualCode" inputmode="numeric">
      <button class="btn small" id="manualGo" style="flex:0 0 auto;margin:0" data-t="ok"></button>
    </div>
  </div>
</div>
<input type="file" id="fileBarcode" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileTag" accept="image/*" capture="environment" class="hidden">
<input type="file" id="filePhoto" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileImport" accept="application/json,.json" class="hidden">
<div id="toast"></div>

/* ---------- Units & money ---------- */
const UNITS = { mL:{base:'mL',f:1}, L:{base:'mL',f:1000}, g:{base:'g',f:1}, kg:{base:'g',f:1000}, count:{base:'count',f:1} };
const isWeight = p => p.basis === 'lb' || p.basis === 'kg';

function unitPrice(prod, price, basis) {
  if (price == null) return null;
  if (isWeight(prod)) return { v: prod.basis === 'lb' ? price / LB_G * 1000 : price, label: '/kg', base: 'g' };
  if (basis === 'uses') return prod.uses > 0 ? { v: price / prod.uses, label: t('perUse'), base: 'uses' } : null;
  const u = UNITS[prod.unit]; if (!u || !(prod.size > 0)) return null;
  const amt = prod.size * u.f;
  if (u.base === 'g') return { v: price / amt * 1000, label: '/kg', base: 'g' };
  if (u.base === 'mL') return { v: price / amt * 100, label: '/100mL', base: 'mL' };
  return { v: price / amt, label: t('perPc'), base: 'count' };
}
const fmtUnit = up => up ? `$${up.v < 0.1 ? up.v.toFixed(3) : up.v.toFixed(2)}${up.label}` : '';
function sizeText(p) {
  if (isWeight(p)) return t('byWeight');
  return [p.size ? `${+p.size}${p.unit === 'count' ? ' ' + t('pcs') : ' ' + p.unit}` : '', p.uses ? `${p.uses} ${t('uses')}` : ''].filter(Boolean).join(' · ');
}
// weight items show the other unit ($/lb ↔ $/kg); packs show unit prices
function extraUnit(p, v) {
  if (p.basis === 'lb') return fmtUnit(unitPrice(p, v));
  if (p.basis === 'kg') return `$${(v * LB_G / 1000).toFixed(2)}/lb`;
  return [fmtUnit(unitPrice(p, v)), p.uses ? fmtUnit(unitPrice(p, v, 'uses')) : ''].filter(Boolean).join(' · ');
}

function parseQty(s) {
  if (!s) return null;
  s = s.toLowerCase().replace(/(\d),(\d)/g, '$1.$2');
  const nu = u => ({ ml:'mL', cl:'mL', l:'L', g:'g', kg:'kg' }[u]);
  let m = s.match(/(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(ml|cl|l|g|kg)\b/);
  if (m) { let v = +m[1] * +m[2]; if (m[3] === 'cl') v *= 10; return { size: +v.toFixed(3), unit: nu(m[3]) }; }
  m = s.match(/(\d+(?:\.\d+)?)\s*(ml|cl|l|g|kg)\b/);
  if (m) { let v = +m[1]; if (m[2] === 'cl') v *= 10; return { size: v, unit: nu(m[2]) }; }

function stats(prices) {

  const sorted = [...prices].sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.ts || 0) - (a.ts || 0));
  let min = sorted[0];
  for (const p of sorted) if (eff(p) < eff(min) - 1e-9) min = p;
  const stores = {};
  for (const p of sorted) {
    const k = p.store || t('noStore');
    const s = stores[k] || (stores[k] = { store: k, min: p, last: p, n: 0 });
    s.n++; if (eff(p) < eff(s.min) - 1e-9) s.min = p;

}

  }

  const s = Math.min(1, 1280 / Math.max(w, h));
  zxCanvas.width = Math.round(w * s); zxCanvas.height = Math.round(h * s);
  zxCanvas.getContext('2d', { willReadFrequently: true }).drawImage(src, 0, 0, zxCanvas.width, zxCanvas.height);
  try { return zxCore.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(zxCanvas)))).getText(); }
  catch (e) { return null; }
}
async function getDetector() {
  if (detector) return detector;
  if (!('BarcodeDetector' in window)) return null;
  const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'];
  let fmts = want;
  try { const sup = await BarcodeDetector.getSupportedFormats(); fmts = want.filter(f => sup.includes(f)); } catch (e) {}
  detector = new BarcodeDetector({ formats: fmts.length ? fmts : want });

}

/* ---------- OCR (Tesseract.js, runs on the phone, free) ---------- */
let ocrWorker = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); });
}
async function getOcr() {
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  ocrWorker = await Tesseract.createWorker('eng');
  await ocrWorker.setParameters({ tessedit_pageseg_mode: '11' }); // sparse text: suits shelf tags
  return ocrWorker;
}
async function prepForOcr(file, max) {
  const img = await loadBitmap(file);
  const s = max / Math.max(img.width, img.height);
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
// Read the tag at three sizes (big shelf digits read better when shrunk), merge candidates.
async function readPriceTag(file, weightMode) {
  const w = await getOcr();
  const all = [];
  for (const max of [1600, 960, 560]) {
    const c = await prepForOcr(file, max);
    const { data } = await w.recognize(c);
    all.push(...extractPrices(data, c.height, weightMode));
  }
  const best = {};
  for (const c of all) { const k = c.price + 'x' + c.multi + (c.partial ? 'p' : '') + c.per; if (!best[k] || best[k].score < c.score) best[k] = c; }
  return Object.values(best).sort((a, b) => b.score - a.score).slice(0, 6);
}
// Pick likely shelf prices: the biggest-printed money values win. Scores are relative to image height.
// weightMode: item sold by weight, so "$6.99/lb" prices are wanted rather than skipped as unit prices.
function extractPrices(data, H = 1, weightMode = '') {
  const words = (data.words || []).map(w => ({ raw: w.text.trim(), h: (w.bbox.y1 - w.bbox.y0) / H, x0: w.bbox.x0 / H, x1: w.bbox.x1 / H, y0: w.bbox.y0 / H })).filter(w => w.raw);
  const out = [];
  const add = (price, multi, score, partial, per) => { if (price > 0 && price < 1000) out.push({ price: Math.round(price * 100) / 100, multi, score, partial: !!partial, per: per || '' }); };
  const unitLike = /\/\s*(100|1)?\s*(ml|g|kg|l|lb|ea|un)|\b(ml|kg|lb)\b|\d\s*(l|ml|g|kg|lb|oz)\b|¢/i;
  let maxH = 0;
  for (let i = 0; i < words.length; i++) {
    const w = words[i], nx = words[i + 1];
    maxH = Math.max(maxH, w.h);
    const tt = w.raw.replace(/[Oo]/g, '0').replace(/[Il|]/g, '1').replace(/S(?=\d)/g, '$');
    if (weightMode) {
      const wre = /\$?(\d{1,3})[.,](\d{2})\s*\/?\s*(lb|kg)\b/i, rw = w.raw.replace(/O(?=\d)|(?<=\d)O/g, '0');
      let wm = rw.match(wre);
      if (!wm && nx && /^\/?\s*(lb|kg)\b/i.test(nx.raw)) wm = (rw + nx.raw).match(wre);
      if (wm) { add(+(wm[1] + '.' + wm[2]), 1, w.h * 1.3, false, wm[3].toLowerCase()); continue; }
    }
    if (unitLike.test(w.raw) || (nx && /^\/|^(ml|g|kg|l|lb|ea)$/i.test(nx.raw))) continue;
    let m = tt.match(/\$?(\d{1,3})[.,](\d{2})(?!\d)/);
    if (m) { add(+(m[1] + '.' + m[2]), 1, w.h * (tt.includes('$') ? 1.1 : 1)); continue; }
    // superscript cents often read as ° " % * — keep the dollars, user types cents
    m = tt.match(/^\$?(\d{1,3})[°º"'%*^]+$/);
    if (m) { add(+m[1], 1, w.h * 1.05, true); continue; }
    m = tt.match(/^\$?(\d{1,3})$/);
    if (m) {
      if (nx) {
        const nt = nx.raw.replace(/[Oo]/g, '0').replace(/\D/g, '');
        if (/^\d{2}$/.test(nt) && nx.h < w.h * 0.85 && nx.x0 - w.x1 < w.h && nx.y0 < w.y0 + w.h * 0.5) { add(+(m[1] + '.' + nt), 1, w.h * 1.05); i++; continue; }
      }
      if (m[1].length >= 3 && !tt.includes('$')) add(+m[1] / 100, 1, w.h * 0.6);
      else if (tt.includes('$')) add(+m[1], 1, w.h * 0.7);
    }
  }
  // multi-buy: "2/$9", "2 for $9", "2 | $9.00" (slash often misread as | or ])
  const txt = data.text || '';
  const lineAt = i => txt.slice(txt.lastIndexOf('\n', i) + 1, (txt.indexOf('\n', i + 1) + 1 || txt.length + 1) - 1);
  const rxs = [/(?:^|\n|[ \t])(\d{1,2})[ \t]*(?:\/|\||\]|for|pour)?[ \t]*\$[ \t]*(\d{1,3}(?:[.,]\d{2})?)/gi, /(\d{1,2})[ \t]*(?:\/|for|pour)[ \t]*\$?[ \t]*(\d{1,3}(?:[.,]\d{2})?)/gi];
  for (const rx of rxs) {
    let mm;
    while ((mm = rx.exec(txt))) { const n = +mm[1]; if (n >= 2 && n <= 24 && !unitLike.test(lineAt(mm.index + 1))) add(+mm[2].replace(',', '.'), n, maxH * 1.2); }
  }
  return out;
}

function chartSvg(sortedDesc, minV) {
  const pts = [...sortedDesc].reverse();
  if (pts.length < 2) return '';
  const W = 320, H = 140, L = 40, R = 10, T = 12, B = 22;
  const ts = pts.map(p => new Date(p.date + 'T00:00').getTime());
  const vs = pts.map(eff);
  let t0 = Math.min(...ts), t1 = Math.max(...ts); if (t1 === t0) t1 = t0 + 864e5;
  let v0 = Math.min(...vs), v1 = Math.max(...vs); if (v1 - v0 < 0.01) { v0 -= 0.5; v1 += 0.5; }
  const pv = (v1 - v0) * 0.12; v0 -= pv; v1 += pv;
  const X = x => L + (x - t0) / (t1 - t0) * (W - L - R), Y = v => T + (1 - (v - v0) / (v1 - v0)) * (H - T - B);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(ts[i]).toFixed(1)},${Y(vs[i]).toFixed(1)}`).join('');
  const dots = pts.map((p, i) => `<circle cx="${X(ts[i]).toFixed(1)}" cy="${Y(vs[i]).toFixed(1)}" r="4.5" fill="${Math.abs(vs[i] - minV) < 0.005 ? 'var(--good)' : 'var(--accent)'}" stroke="var(--card)" stroke-width="2"/>`).join('');
  return `<div class="card"><h2>📈 ${t('trend')}</h2><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${L}" x2="${W - R}" y1="${Y(minV)}" y2="${Y(minV)}" stroke="var(--good)" stroke-dasharray="4 4"/>
    <text x="${L - 4}" y="${Y(minV) + 4}" font-size="10" text-anchor="end" fill="var(--good)">${minV.toFixed(2)}</text>
    <text x="${L - 4}" y="${T + 8}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.max(...vs).toFixed(2)}</text>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text x="${L}" y="${H - 6}" font-size="10" fill="var(--muted)">${fmtDate(pts[0].date)}</text>
    <text x="${W - R}" y="${H - 6}" font-size="10" text-anchor="end" fill="var(--muted)">${fmtDate(pts[pts.length - 1].date)}</text>
  </svg></div>`;
}

    if (!editing) {
      const exist = await getOne('products', id);
      if (exist) { toast(t('codeExists')); location.hash = `#product/${encodeURIComponent(id)}`; return; }
    }
    const name = $('#fName').value.trim();
    if (!name) return toast(t('needName'));
    if (!editing && id.startsWith('M')) {
      const dup = (await getAll('products')).find(x => x.id.startsWith('M') && x.name.trim().toLowerCase() === name.toLowerCase() && (x.basis || 'item') === basis);
      if (dup) { toast(t('dupName') + dup.name); location.replace(`#add/${encodeURIComponent(dup.id)}`); return; }
    }
    const w = basis !== 'item';
    const prod = {
      id, name, brand: $('#fBrand').value.trim(), basis,
      size: w ? '' : (parseFloat($('#fSize').value) || ''), unit: $('#fUnit').value, uses: w ? '' : (parseInt($('#fUses').value) || ''),
      category: $('#fCat').value.trim(), image, photo, created: editing ? editing.created : today()
    };
    await save('products', prod);
    toast(t('saved'));
    location.replace(editing ? `#product/${encodeURIComponent(id)}` : `#add/${encodeURIComponent(id)}`);
  };
}

async function viewAddPrice(id) {
  const p = await getOne('products', id);
  if (!p) { location.hash = '#home'; return; }
  setHeader(t('logPrice'), true); setTab('home');
  const prior = stats(await pricesFor(id));
  const stores = [...new Set((await getAll('prices')).map(x => x.store).filter(Boolean))];
  const w = isWeight(p);
  app.innerHTML = `
    <div class="card"><div class="item" style="padding:0;border:0">${thumbHtml(p)}<div class="main"><div class="name">${esc(p.name)}</div>
      <div class="muted">${esc([p.brand, sizeText(p)].filter(Boolean).join(' · '))}</div></div></div></div>
    <div class="card">
      <button class="btn sec" id="ocrBtn">${t('ocrBtn')}</button>
      <div id="ocrMsg" class="muted"></div><div class="chips" id="chips"></div>
      <label>${t(p.basis === 'lb' ? 'priceLb' : p.basis === 'kg' ? 'priceKg' : 'price')}</label><input id="aPrice" class="big" inputmode="decimal" placeholder="0.00">
      <div class="${w ? 'hidden' : ''}"><label>${t('multi')}</label><input id="aMulti" inputmode="numeric" value="1"></div>
      <div id="verdict"></div>
      <label>${t('store')}</label><input id="aStore" list="storeList" value="${esc(lsGet('lastStore') || '')}" placeholder="${esc(t('storePh'))}">
      <datalist id="storeList">${stores.map(s => `<option value="${esc(s)}">`).join('')}</datalist>
      <div class="row"><div><label>${t('date')}</label><input id="aDate" type="date" value="${today()}"></div>
        <div><label>&nbsp;</label><label style="display:flex;gap:8px;align-items:center;color:var(--text);font-size:16px;margin:0;padding:11px 0"><input id="aSale" type="checkbox" style="width:auto"> ${t('sale')}</label></div></div>
      <label>${t('note')}</label><input id="aNote" placeholder="${esc(t('notePh'))}">
    </div>
    <button class="btn" id="aSave">${t('save')}</button>`;
  const upd = () => {
    const price = parseFloat($('#aPrice').value), multi = parseInt($('#aMulti').value) || 1;
    const per = price / multi;
    const v = verdict(p, per, prior);
    $('#verdict').innerHTML = verdictHtml(v, multi > 1 && price > 0 ? `${t('each')} ${money(per)}. ` : '', price > 0 ? extraUnit(p, per) : '');
  };
  $('#aPrice').oninput = upd; $('#aMulti').oninput = upd; upd();
  $('#ocrBtn').onclick = async () => {
    const f = await pickFile($('#fileTag')); if (!f) return;
    const msg = $('#ocrMsg'); $('#chips').innerHTML = '';
    msg.textContent = ocrWorker ? t('ocrReading') : t('ocrFirst');
    try {
      await getOcr();
      msg.textContent = t('ocrReading');
      const c = await readPriceTag(f, w ? p.basis : '');
      if (!c.length) { msg.textContent = t('ocrNone'); return; }
      msg.textContent = t('ocrPick');
      const label = x => (x.multi > 1 ? tf('itemsAt', x.multi, '') : '') + (x.partial ? '$' + x.price + '.??' : money(x.price)) + (x.per ? '/' + x.per : '');
      $('#chips').innerHTML = c.map((x, i) => `<button class="chip" data-i="${i}">${label(x)}</button>`).join('');
      const use = x => {
        $('#aMulti').value = x.multi;
        let v = x.price;
        if (w && x.per && x.per !== p.basis) v = x.per === 'kg' ? v * LB_G / 1000 : v / LB_G * 1000; // convert to the item's unit
        if (x.partial) { const el = $('#aPrice'); el.value = Math.floor(v) + '.'; el.focus(); el.setSelectionRange(el.value.length, el.value.length); toast(t('ocrCents')); }
        else $('#aPrice').value = v.toFixed(2);
        upd();
      };
      $('#chips').querySelectorAll('.chip').forEach(b => b.onclick = () => use(c[+b.dataset.i]));
      use(c[0]);
    } catch (e) { msg.textContent = t('ocrFail'); }
  };
  $('#aSave').onclick = async () => {
    const price = parseFloat($('#aPrice').value);
    if (!(price > 0)) return toast(t('needPrice'));
    const multi = w ? 1 : (parseInt($('#aMulti').value) || 1);
    const rec = { id: newId(), ts: Date.now(), by: fbUser ? fbUser.email : '', productId: id, price: Math.round(price * 100) / 100, multi, store: $('#aStore').value.trim(),
                  date: $('#aDate').value || today(), sale: $('#aSale').checked, note: $('#aNote').value.trim() };
    await save('prices', rec);
    if (rec.store) lsSet('lastStore', rec.store);
    const v = verdict(p, price / multi, prior);
    toast(v.cls === 'good' ? t('savedLow') : v.cls === 'eq' ? t('savedEq') : t('saved'), 3200);
    location.replace(`#product/${encodeURIComponent(id)}`);
  };
}

async function viewCompare() {
  setHeader(t('cmpTitle')); setTab('compare');
  const list = await allWithStats();
  const cats = [...new Set(list.map(x => x.p.category).filter(Boolean))].sort();
  const sel = lsGet('cmpCat'), basisSel = lsGet('cmpBasis') || 'size';
  app.innerHTML = `
    <div class="card">
      <label>${t('cmpCat')}</label><select id="cCat">${cats.length ? cats.map(c => `<option ${c === sel ? 'selected' : ''}>${esc(c)}</option>`).join('') : `<option value="">${t('cmpNoCat')}</option>`}</select>
      <label>${t('cmpBasis')}</label><select id="cBasis">
        <option value="size" ${basisSel === 'size' ? 'selected' : ''}>${t('cmpSize')}</option>
        <option value="uses" ${basisSel === 'uses' ? 'selected' : ''}>${t('cmpUses')}</option></select>
      <div class="muted" style="margin-top:8px">${t('cmpHint')}</div>
    </div>
    <div id="cOut"></div>`;
  const render = () => {
    const cat = $('#cCat').value, basis = $('#cBasis').value;
    lsSet('cmpCat', cat); lsSet('cmpBasis', basis);
    const rows = list.filter(x => x.p.category === cat && x.s).map(x => ({ ...x, up: unitPrice(x.p, eff(x.s.min), basis) }));
    const ok = rows.filter(r => r.up), missing = rows.filter(r => !r.up);
    const groups = {};
    for (const r of ok) (groups[r.up.base] || (groups[r.up.base] = [])).push(r);
    let html = '';
    for (const g of Object.values(groups)) {
      g.sort((a, b) => a.up.v - b.up.v);
      html += `<div class="card"><table><tr><th>${t('cmpItem')}</th><th class="r">${t('cmpLow')}</th><th class="r">${t('cmpUnit')}</th></tr>
        ${g.map((r, i) => `<tr><td><a href="#product/${encodeURIComponent(r.p.id)}" style="color:inherit">${esc(r.p.name)}</a>${i === 0 && g.length > 1 ? `<span class="tag">🏆 ${t('best')}</span>` : ''}
          <div class="muted">${esc(sizeText(r.p))} · ${esc(r.s.min.store || '')}</div></td>
          <td class="r">${pMoney(r.p, eff(r.s.min))}</td><td class="r"><b>${fmtUnit(r.up)}</b>${i > 0 ? `<div class="muted">+${Math.round((r.up.v / g[0].up.v - 1) * 100)}%</div>` : ''}</td></tr>`).join('')}
      </table></div>`;
    }
    if (missing.length) html += `<div class="card muted">${tf('cmpMissing', basis === 'uses' ? t('whatUses') : t('whatSize'))}${missing.map(r => esc(r.p.name)).join(LANG === 'zh' ? '、' : ', ')}</div>`;
    if (!rows.length) html = `<div class="card empty">${dog('sniff', 'glass')}<div class="muted">${cats.length ? t('cmpNoData') : t('cmpEmpty')}</div></div>`;
    $('#cOut').innerHTML = html;
  };
  $('#cCat').onchange = render; $('#cBasis').onchange = render; render();
}

async function viewSettings() {
  setHeader(t('setTitle')); setTab('settings');
  const [prods, prices] = await Promise.all([getAll('products'), getAll('prices')]);
  let persisted = false; try { persisted = navigator.storage && await navigator.storage.persisted(); } catch (e) {}
  app.innerHTML = `
    <div class="card"><h2>🌐 ${t('lang')}</h2>
      <div class="seg" id="sLang"><button data-l="zh" class="${LANG === 'zh' ? 'on' : ''}">繁體中文</button><button data-l="en" class="${LANG === 'en' ? 'on' : ''}">English</button></div></div>
    <div class="card"><h2>☁️ ${t('syncTitle')}</h2>
      <div class="muted">${t('syncDesc')}</div>
      <div style="margin:10px 0;font-weight:700">${fbUser ? t('signedInAs') + esc(fbUser.email) + ' · ' : ''}<span id="syncStatus">${syncLabel()}</span></div>
      ${fbUser ? `<button class="btn sec" id="sSignOut">${t('signOut')}</button>` : `<button class="btn" id="sSignIn">${t('signIn')}</button>`}
    </div>
    <div class="card"><h2>🦴 ${t('data')}</h2><div class="muted">${tf('dataCount', prods.length, prices.length)}<br>
      ${syncOn() ? t('dataCloud') : t('dataLocal') + ' ' + (persisted ? t('persistOn') : t('persistOff'))}</div></div>
    <div class="card"><h2>⚠️ ${t('danger')}</h2><button class="btn danger" id="sWipe">${t('wipe')}</button></div>
    <div class="empty">${dog('sleep', 'z')}<div class="muted"><span class="brand" style="font-weight:800;font-size:16px">PricePup 格價狗</span> v${APP_VERSION}<br>${t('credit')}</div></div>`;
  $('#sLang').querySelectorAll('button').forEach(b => b.onclick = () => { LANG = b.dataset.l; lsSet('lang', LANG); applyStatic(); setSync(syncState); viewSettings(); });
  if ($('#sSignIn')) $('#sSignIn').onclick = signIn;
  if ($('#sSignOut')) $('#sSignOut').onclick = signOutSync;
  $('#sWipe').onclick = async () => {
    if (syncOn()) return toast(t('wipeSynced'), 4000);
    if (!confirm(t('wipeConfirm'))) return;
    await p2(store('prices', 'readwrite').clear()); await p2(store('products', 'readwrite').clear());
    toast(t('wiped')); viewSettings();
  };
}
async function importData(d) {
  if (!d || d.app !== 'gaakgaa' || !Array.isArray(d.products) || !Array.isArray(d.prices)) throw new Error('bad');
  for (const p of d.products) { if (p && p.id) await save('products', p); }
  const key = x => [x.productId, x.date, x.price, x.multi || 1, x.store || ''].join('|');
  const existing = new Set((await getAll('prices')).map(key));
  let r = 0;
  for (const x of d.prices) {
    if (!x || !x.productId || existing.has(key(x))) continue;
    await save('prices', { ...x, id: typeof x.id === 'string' ? x.id : newId() }); existing.add(key(x)); r++;
  }
  return { p: d.products.length, r };
}

/* ---------- Router ---------- */
async function route(bg) {
  const h = location.hash.slice(1);
  const i = h.indexOf('/');
  const r = i < 0 ? h : h.slice(0, i), arg = i < 0 ? '' : decodeURIComponent(h.slice(i + 1));
  if (!bg) window.scrollTo(0, 0);
  if (r !== 'scan' && scanStream && !bg) closeScanner();
  switch (r) {
    case 'product': return viewProduct(arg);
    case 'new': return viewProductForm(normCode(arg));
    case 'edit': return viewProductForm('', arg);
    case 'add': return viewAddPrice(arg);
    case 'compare': return viewCompare();
    case 'settings': return viewSettings();
    case 'scan': await viewHome(); setTab('scan'); return openScanner();
    default: return viewHome();
  }
}
window.addEventListener('hashchange', route);

(async () => {
  applyStatic();
  await openDB();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  route();
  if (lsGet('sync') === '1') { setSync('connecting'); loadFb().catch(e => setSync('error', e.message)); }
})();
</script>
